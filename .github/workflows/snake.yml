name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#4F7EF7&color_dots=#ebedf0,#c6d4fb,#9fb7f8,#7799f5,#4F7EF7
            dist/github-snake-dark.svg?color_snake=#C9D1D9&color_dots=#161b22,#1e2a4a,#2d4a8f,#3d66d0,#4F7EF7

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.3.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
